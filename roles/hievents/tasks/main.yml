---
- name: Ensure application directory exists
  file:
    path: /opt/hievents
    state: directory
    owner: "{{ ansible_user | default('artem.kireev') }}"
    group: "{{ ansible_user | default('artem.kireev') }}"
    mode: '0755'

- name: Clone Hi.Events repository
  git:
    repo: https://github.com/HiEventsDev/Hi.Events.git
    dest: /opt/hievents
    version: main
    force: yes

- name: Set ownership for application directory
  file:
    path: /opt/hievents
    state: directory
    recurse: yes
    owner: "{{ ansible_user | default('artem.kireev') }}"
    group: "{{ ansible_user | default('artem.kireev') }}"

- name: Create .env file from template
  template:
    src: env.j2
    dest: /opt/hievents/.env
    owner: "{{ ansible_user | default('artem.kireev') }}"
    group: "{{ ansible_user | default('artem.kireev') }}"
    mode: '0644'

- name: Install backend dependencies with Composer
  command: composer install --no-interaction --prefer-dist --optimize-autoloader
  args:
    chdir: /opt/hievents/backend

- name: Install frontend dependencies with npm
  command: npm install
  args:
    chdir: /opt/hievents/frontend

- name: Build frontend assets
  command: npm run build
  args:
    chdir: /opt/hievents/frontend

- name: Generate application key
  command: php artisan key:generate --force
  args:
    chdir: /opt/hievents/backend

- name: Run database migrations
  command: php artisan migrate --force
  args:
    chdir: /opt/hievents/backend
