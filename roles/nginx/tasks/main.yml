---
- name: Install nginx
  dnf:
    name: nginx
    state: present

- name: Copy nginx main configuration
  copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'

- name: Copy site configuration
  template:
    src: hievents.conf.j2
    dest: /etc/nginx/conf.d/hievents.conf
    owner: root
    group: root
    mode: '0644'

- name: Start and enable nginx
  systemd:
    name: nginx
    state: started
    enabled: true
