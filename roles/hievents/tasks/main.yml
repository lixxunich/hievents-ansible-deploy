---
- name: Ensure application directory exists
  file:
    path: /opt/hievents
    state: directory
    owner: "{{ ansible_user | default('artem.kireev') }}"
    group: "{{ ansible_user | default('artem.kireev') }}"
    mode: '0755'

- name: Install PostgreSQL contrib package
  become: yes
  dnf:
    name: postgresql-contrib
    state: present
    update_cache: yes

- name: Clone Hi.Events repository
  git:
    repo: https://github.com/HiEventsDev/Hi.Events.git
    dest: /opt/hievents
    version: main
    force: yes

- name: Set ownership for application directory
  file:
    path: /opt/hievents
    state: directory
    recurse: yes
    owner: "{{ ansible_user | default('artem.kireev') }}"
    group: "{{ ansible_user | default('artem.kireev') }}"

- name: Create backend .env file from template
  template:
    src: env.j2
    dest: /opt/hievents/backend/.env
    owner: "{{ ansible_user | default('artem.kireev') }}"
    group: "{{ ansible_user | default('artem.kireev') }}"
    mode: '0644'

- name: Read DB name from backend .env
  shell: "grep '^DB_DATABASE=' /opt/hievents/backend/.env | cut -d= -f2-"
  register: hievents_db_name
  changed_when: false

- name: Read DB user from backend .env
  shell: "grep '^DB_USERNAME=' /opt/hievents/backend/.env | cut -d= -f2-"
  register: hievents_db_user
  changed_when: false

- name: Grant schema privileges and enable pg_trgm
  become: yes
  become_user: postgres
  shell: |
    psql -d "{{ hievents_db_name.stdout }}" -c "GRANT ALL PRIVILEGES ON SCHEMA public TO \"{{ hievents_db_user.stdout }}\";"
    psql -d "{{ hievents_db_name.stdout }}" -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"{{ hievents_db_user.stdout }}\";"
    psql -d "{{ hievents_db_name.stdout }}" -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO \"{{ hievents_db_user.stdout }}\";"
    psql -d "{{ hievents_db_name.stdout }}" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"{{ hievents_db_user.stdout }}\";"
    psql -d "{{ hievents_db_name.stdout }}" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO \"{{ hievents_db_user.stdout }}\";"
    psql -d "{{ hievents_db_name.stdout }}" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
  changed_when: false

- name: Install backend dependencies with Composer
  command: composer install --no-interaction --prefer-dist --optimize-autoloader
  args:
    chdir: /opt/hievents/backend

- name: Install frontend dependencies with npm
  command: npm install
  args:
    chdir: /opt/hievents/frontend

- name: Build frontend assets
  command: npm run build
  args:
    chdir: /opt/hievents/frontend

- name: Generate application key
  command: php artisan key:generate --force
  args:
    chdir: /opt/hievents/backend

- name: Run database migrations
  command: php artisan migrate --force
  args:
    chdir: /opt/hievents/backend
